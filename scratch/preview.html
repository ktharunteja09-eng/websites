<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #1C1C1C; color: white; font-family: sans-serif; padding: 40px; display: flex; flex-direction: column; gap: 30px; align-items: center; }
  .box { padding: 20px; border: 1px solid #333; border-radius: 12px; display: flex; align-items: center; gap: 16px; }
  .light { background: #FDFBF7; color: #1C1C1C; }
  .dark { background: #2E4823; color: white; }
  .brand-text { font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: bold; }
  .sub-text { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: #D3452B; }
</style>
</head>
<body>
  <h2>Brand Emblem Previews (Dark & Light)</h2>
  
  <div class="box dark">
    <!-- SVG will be inserted here -->
    <div id="emblem-container-1"></div>
    <div>
      <div class="brand-text">Vaibhav Grand</div>
      <div class="sub-text" style="color: rgba(253, 251, 247, 0.8);">Family Restaurant • Renigunta</div>
    </div>
  </div>

  <div class="box light">
    <div id="emblem-container-2"></div>
    <div>
      <div class="brand-text" style="color: #2E4823;">Vaibhav Grand</div>
      <div class="sub-text">Family Restaurant • Renigunta</div>
    </div>
  </div>
</body>
</html>
