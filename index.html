<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- LCP Hero Image Preload with responsive srcset & sizes -->
  <link
    rel="preload"
    as="image"
    href="/assets/images/chicken_mandi_hero_1080w.webp"
    imagesrcset="/assets/images/chicken_mandi_hero_640w.webp 640w, /assets/images/chicken_mandi_hero_1080w.webp 1080w, /assets/images/chicken_mandi_hero_1400w.webp 1400w"
    imagesizes="(max-width: 640px) 640px, (max-width: 1080px) 1080px, 1400px"
    fetchpriority="high"
  />

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts: Playfair Display (h1 hero) & Inter (body) with font-display: swap, no unused font weights -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap"
  />
</head>

<body class="bg-[#FDFBF7] text-[#1C1C1C] font-sans antialiased selection:bg-[#2E4823] selection:text-[#FDFBF7]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
